  <g fill="#b58e4a">
    <path d="M260 148 L266.8 178.5 L298 185 L266.8 191.5 L260 222 L253.2 191.5 L222 185 L253.2 178.5 Z" />
    <rect x="258.5" y="292" width="3" height="36" rx="1.5" />
